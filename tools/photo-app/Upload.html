<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f4f2ee; --card:#fff; --ink:#1d1d1f; --mute:#77736b; --line:#e2ddd4; --accent:#1f4e5f; --ok:#2f7d4f; --err:#b3412f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .brand { font-size:11px; letter-spacing:.18em; color:var(--mute); font-weight:600; }
  h1 { font-size:22px; margin:6px 0 6px; }
  .sub { font-size:13px; color:var(--mute); margin:0 0 16px; line-height:1.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--mute); margin:0 0 6px; font-weight:600; }
  input[type=text], input[type=date] { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .row { margin-bottom:14px; } .row:last-child { margin-bottom:0; }
  .pick { display:flex; align-items:center; justify-content:center; height:120px; border:2px dashed var(--line); border-radius:14px; background:#faf9f6; font-size:16px; font-weight:600; color:var(--accent); cursor:pointer; }
  #files { display:none; }
  button { width:100%; font-size:17px; font-weight:700; padding:15px; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; }
  .pick.sm { height:56px; font-size:15px; margin-top:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px; }
  .grid:empty { display:none; }
  .tile { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#e8e4dc; }
  .tile img, .tile video { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .x { position:absolute; top:4px; right:4px; width:26px; height:26px; padding:0; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:14px; line-height:26px; }
  .tile .pl { position:absolute; left:6px; bottom:4px; color:#fff; font-size:13px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.7); }
  .tile .st { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#fff; background:rgba(0,0,0,.45); }
  .tile.ok .st { background:rgba(47,125,79,.55); } .tile.err .st { background:rgba(179,65,47,.6); }
  .cnt { font-size:13px; color:var(--mute); margin:10px 0 0; text-align:center; }
  .ok { color:var(--ok); } .err { color:var(--err); } .mute { color:var(--mute); }
  #msg { text-align:center; font-weight:700; margin-top:14px; min-height:1.4em; line-height:1.5; }
</style>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">90.4 BATH INTERIOR DESIGN</div>
  <h1 id="ttl">현장사진 올리기</h1>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="row"><label for="site">현장 <span class="mute">(몰라도 비워두면 돼요)</span></label><input type="text" id="site" value="<?= site ?>" placeholder="비워두면 미분류 → 밤에 자동 정리"></div>
    <div class="row" id="dateRow"><label for="date">날짜</label><input type="date" id="date" value="<?= date ?>"></div>
  </div>

  <div class="card">
    <div class="grid" id="grid"></div>
    <label class="pick" for="files" id="pickLabel">＋ 사진·동영상 선택 (여러 개 가능)</label>
    <input type="file" id="files" accept="image/*,video/*" multiple>
    <p class="cnt" id="cnt" hidden></p>
  </div>

  <button id="go" disabled>올리기</button>
  <div id="msg"></div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  function mode() {
    var has = $('site').value.trim() !== '';
    $('dateRow').style.display = has ? '' : 'none';
    $('ttl').textContent = has ? '현장사진 올리기' : '현장사진 막 올리기';
    $('sub').textContent = has ? '이 현장 폴더로 바로 들어가요.' : '현장 몰라도 그냥 올리세요. 찍은 날짜·위치를 보고 밤에 맞는 현장으로 옮겨요.';
  }
  $('site').addEventListener('input', mode); mode();

  // 고른 것: {f 파일, u 미리보기 주소, st 'wait'|'up'|'ok'|'err', el 타일}
  var items = [], busy = false;
  var keyOf = function (f) { return f.name + '|' + f.size + '|' + f.lastModified; };
  function refresh() {
    var wait = items.filter(function (x) { return x.st !== 'ok'; }).length;
    $('pickLabel').textContent = items.length ? '＋ 더 추가하기' : '＋ 사진·동영상 선택 (여러 개 가능)';
    $('pickLabel').classList.toggle('sm', items.length > 0);
    $('cnt').hidden = !items.length;
    $('cnt').textContent = items.length + '개 골랐어요 · 빠진 건 「더 추가하기」, 잘못 고른 건 ✕';
    $('go').disabled = busy || wait === 0;
    $('go').textContent = busy ? '올리는 중…' : (wait ? wait + '개 올리기' : '올리기');
  }
  function tile(x) {
    var d = document.createElement('div'); d.className = 'tile';
    var v = /^video\//.test(x.f.type);
    var m = document.createElement(v ? 'video' : 'img');
    if (v) { m.muted = true; m.playsInline = true; m.preload = 'metadata'; m.src = x.u + '#t=0.1'; } else { m.src = x.u; m.alt = ''; }
    d.appendChild(m);
    if (v) { var p = document.createElement('span'); p.className = 'pl'; p.textContent = '▶ 동영상'; d.appendChild(p); }
    var b = document.createElement('button'); b.type = 'button'; b.className = 'x'; b.textContent = '✕'; b.setAttribute('aria-label', '빼기');
    b.onclick = function () { if (busy) return; items = items.filter(function (y) { return y !== x; }); URL.revokeObjectURL(x.u); d.remove(); refresh(); };
    d.appendChild(b);
    var s = document.createElement('span'); s.className = 'st'; s.hidden = true; d.appendChild(s);
    x.el = d; x.s = s; x.x = b;
    return d;
  }
  function mark(x, st, txt) {
    x.st = st; x.el.className = 'tile' + (st === 'ok' ? ' ok' : st === 'err' ? ' err' : '');
    x.s.hidden = st === 'wait'; x.s.textContent = txt || ''; x.x.hidden = st === 'up' || st === 'ok';
  }
  $('files').addEventListener('change', function () {
    if (busy) { this.value = ''; return; }
    // 다 올린 것은 치우고 새로 고른 것만 이어 붙임
    items = items.filter(function (x) { if (x.st === 'ok') { URL.revokeObjectURL(x.u); x.el.remove(); return false; } return true; });
    var have = {}; items.forEach(function (x) { have[keyOf(x.f)] = 1; });
    Array.prototype.forEach.call(this.files, function (f) {
      if (have[keyOf(f)]) return; have[keyOf(f)] = 1;
      var x = {f: f, u: URL.createObjectURL(f), st: 'wait'}; items.push(x); $('grid').appendChild(tile(x));
    });
    this.value = ''; // 같은 파일을 다시 골라도 되게
    $('msg').textContent = '';
    refresh();
  });

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // 사진에 남은 찍은 시각·위치 (줄이기 전에 읽어둠 — 줄이면 사라짐)
  async function readMeta(file) {
    var m = {};
    try {
      if (window.exifr && /^image\//.test(file.type)) {
        var x = await exifr.parse(file, {tiff: true, exif: true, gps: true});
        if (x) {
          var t = x.DateTimeOriginal || x.CreateDate || x.ModifyDate;
          if (t instanceof Date && !isNaN(t)) m.taken = t.toISOString();
          if (isFinite(x.latitude) && isFinite(x.longitude)) { m.lat = x.latitude; m.lng = x.longitude; }
        }
      }
    } catch (e) {}
    if (!m.taken && file.lastModified) m.taken = new Date(file.lastModified).toISOString();
    return m;
  }

  // 큰 사진은 긴 변 2400px JPEG로 줄여서 올림 (속도·용량)
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 2400, w = img.naturalWidth, h = img.naturalHeight;
        var r = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * r); c.height = Math.round(h * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        // 보기 페이지용 작은 사진 (긴 변 360px)
        var t = document.createElement('canvas'), tr = Math.min(1, 360 / Math.max(w, h));
        t.width = Math.round(w * tr); t.height = Math.round(h * tr);
        t.getContext('2d').drawImage(img, 0, 0, t.width, t.height);
        URL.revokeObjectURL(url);
        resolve({big: c.toDataURL('image/jpeg', 0.85).split(',')[1], small: t.toDataURL('image/jpeg', 0.7).split(',')[1]});
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요')); };
      img.src = url;
    });
  }

  function run(fn) { var a = [].slice.call(arguments, 1); return new Promise(function (ok, no) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(no); r[fn].apply(r, a); }); }
  function b64Of(blob) {
    return new Promise(function (ok, no) { var fr = new FileReader(); fr.onload = function () { ok(String(fr.result).split(',')[1] || ''); }; fr.onerror = no; fr.readAsDataURL(blob); });
  }
  // 동영상은 4MB씩 잘라서 이어 올림 (큰 파일도 됨)
  async function sendVideo(file, site, date, meta, s) {
    var url = await run('startVideo', site, date, file.name, file.type || 'video/mp4', file.size, meta);
    var CH = 4 * 1024 * 1024, pos = 0;
    while (pos < file.size) {
      var b64 = await b64Of(file.slice(pos, Math.min(pos + CH, file.size))), r = null;
      for (var k = 0; k < 3 && !r; k++) { try { r = await run('putVideo', url, b64, pos, file.size); } catch (e) { if (k === 2) throw e; } }
      s.textContent = Math.round(Math.min(pos + CH, file.size) / file.size * 100) + '%';
      if (r.done) return;
      pos = r.next;
    }
  }

  function send(site, date, name, b64, meta) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
        .upload(site, date, '', name, 'image/jpeg', b64, meta);
    });
  }

  $('go').addEventListener('click', async function () {
    var site = $('site').value.trim(), date = $('date').value;
    var todo = items.filter(function (x) { return x.st !== 'ok'; });
    if (!todo.length) return;
    busy = true; refresh(); $('msg').textContent = '';
    var okCount = 0;
    for (var i = 0; i < todo.length; i++) {
      var x = todo[i];
      mark(x, 'up', '올리는 중');
      try {
        var meta = await readMeta(x.f);
        if (/^video\//.test(x.f.type)) {
          await sendVideo(x.f, site, date, meta, x.s);
        } else {
          var im = await shrink(x.f);
          var base = x.f.name.replace(/\.[^.]+$/, '') + '.jpg';
          meta.thumb = im.small;
          await send(site, date, base, im.big, meta);
        }
        mark(x, 'ok', '✓'); okCount++;
      } catch (e) {
        mark(x, 'err', '실패');
      }
    }
    busy = false; refresh();
    $('msg').innerHTML = okCount === todo.length
      ? '<span class="ok">' + okCount + '개 올렸어요 ✓' + (site ? '' : '<br><small class="mute">밤에 현장별로 정리돼요</small>') + '</span>'
      : '<span class="err">' + (todo.length - okCount) + '개 실패 — 「' + (todo.length - okCount) + '개 올리기」를 한 번 더 눌러주세요</span>';
  });
</script>
</body>
</html>
