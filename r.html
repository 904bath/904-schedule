<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>904 외주 회신</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&family=Poppins:wght@600;800&display=swap">
<style>
  :root{--bg:#f2f5f3;--fg:#1b1f1d;--muted:#66706b;--card:#fff;--line:#dde3e0;--go:#1f5c3d;--go-soft:#e6f0ea;--no:#b23a2f;--no-soft:#f8e7e4;--alt:#8a5a0f;--alt-soft:#fbf1dc;--font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#111413;--fg:#eef2f0;--muted:#9aa39f;--card:#1b201e;--line:#2c3331;--go:#3d9a63;--go-soft:#1d3226;--no:#e0675b;--no-soft:#3a201d;--alt:#e2b45c;--alt-soft:#352b17;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.5 var(--font);padding:18px max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
  main{max-width:440px;margin:0 auto;display:grid;gap:14px}
  .top{display:flex;align-items:center;gap:10px}
  .top img{width:34px;height:34px;object-fit:contain}
  .top b{font:800 16px Poppins,var(--font);letter-spacing:.5px}.top small{display:block;font:600 9.5px Poppins,sans-serif;letter-spacing:1.6px;color:var(--muted)}
  .top .kind{margin-left:auto;padding:5px 10px;border-radius:999px;background:var(--go);color:#fff;font:800 13px var(--font);white-space:nowrap}
  h1{margin:0;font:800 20px/1.35 var(--font);text-wrap:balance}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
  .sec{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
  .sec>i{font-style:normal;font:800 12px var(--font);color:var(--go);padding-top:2px;letter-spacing:.5px}
  .sec>div{min-width:0;overflow-wrap:anywhere}
  .site{font:800 16px var(--font)}.dim{color:var(--muted)}
  .days{display:grid;gap:5px}.day{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:10px;background:var(--go-soft)}
  .day b{flex:none;font:800 15px Poppins,var(--font);font-variant-numeric:tabular-nums}.day em{font-style:normal;font-weight:700;font-size:13px}
  .memo{padding:7px 10px;border-radius:10px;background:var(--alt-soft)}
  .who div{display:flex;gap:8px}.who b{min-width:40px}.who a{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:700}
  .q{font:800 16px var(--font);margin:4px 0 0}
  .ans{display:grid;gap:8px}
  .ans button{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:800 17px var(--font);text-align:left;cursor:pointer;touch-action:manipulation}
  .ans button small{margin-left:auto;font:600 12.5px var(--font);color:var(--muted)}
  .ans button[aria-pressed="true"][data-a="ok"]{border-color:var(--go);background:var(--go-soft)}
  .ans button[aria-pressed="true"][data-a="no"]{border-color:var(--no);background:var(--no-soft)}
  .ans button[aria-pressed="true"][data-a="alt"]{border-color:var(--alt);background:var(--alt-soft)}
  .ans button:focus-visible,.send:focus-visible{outline:3px solid var(--go);outline-offset:2px}
  .more{display:grid;gap:10px}
  label{display:grid;gap:5px;font:700 13px var(--font);color:var(--muted)}
  input,textarea{width:100%;font:600 16px var(--font);color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
  .dates{display:grid;gap:6px}
  .dates .r{display:flex;gap:6px}.dates .r input{flex:1;min-width:0}.dates .r button{flex:none;width:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:700 18px var(--font)}
  .won{position:relative;display:block}.won input{padding-right:40px;font-variant-numeric:tabular-nums}.won em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:700}
  .fb{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--no-soft);text-align:center}.fb b{font:800 15px var(--font);color:var(--no)}.fb small{color:var(--muted)}
  a.send{display:grid;place-items:center;text-decoration:none}
  .add{justify-self:start;border:0;background:none;color:var(--go);font:700 14px var(--font);padding:4px 0;cursor:pointer}
  .send{min-height:58px;border:0;border-radius:16px;background:var(--go);color:#fff;font:800 18px var(--font);cursor:pointer;touch-action:manipulation}
  .send:disabled{opacity:.5}
  .done{text-align:center;display:grid;gap:10px;padding:26px 14px}
  .done b{font:800 22px var(--font)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92%;padding:11px 16px;border-radius:12px;background:#1b1f1d;color:#fff;font:700 14px var(--font)}
  @media (prefers-reduced-motion:no-preference){.ans button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main id="m">
  <div class="top"><img src="logo904.png" alt=""><div><b>90.4 BATH</b><small>INTERIOR DESIGN</small></div><span class="kind" id="kind"></span></div>
  <h1 id="h"></h1>
  <div class="card" id="card"></div>
  <p class="q">가능 여부를 눌러 주세요</p>
  <div class="ans" id="ans">
    <button type="button" data-a="ok" aria-pressed="false">✓ 가능해요<small>위 일정대로</small></button>
    <button type="button" data-a="alt" aria-pressed="false">📅 다른 날 가능해요<small>날짜 고르기</small></button>
    <button type="button" data-a="no" aria-pressed="false">✕ 어려워요<small>이번엔 불가</small></button>
  </div>
  <div class="more" id="more" hidden>
    <div class="dates" id="altBox" hidden><label for="alt0">가능한 날짜</label><div id="altList"></div><button type="button" class="add" id="addDate">+ 날짜 더 넣기</button></div>
    <label for="amt" id="amtBox">예상 견적 금액 <span class="dim" style="font-weight:500">(알면 적어 주세요)</span><span class="won"><input id="amt" inputmode="numeric" placeholder="예: 350,000" autocomplete="off"><em>원</em></span></label>
    <label for="note">메모 <span class="dim" style="font-weight:500">(안 적어도 돼요)</span><textarea id="note" rows="3" placeholder="예: 오후에 가능해요, 자재는 저희가 가져가요"></textarea></label>
    <label for="by">보내는 분<input id="by" autocomplete="name"></label>
    <button type="button" class="send" id="send">회신 보내기</button>
  </div>
</main>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
  var SEND_TO = "https://formsubmit.co/ajax/904bath@gmail.com";
  var $ = function(id){ return document.getElementById(id); };
  var H = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var fmt = function(d){ d = String(d || "").replace(/[^\d]/g, ""); if (/^\d{10,11}$/.test(d)) return d.replace(/^(\d{3})(\d{3,4})(\d{4})$/, "$1-$2-$3"); return d; };
  var T = 0, toast = function(t){ var x = $("toast"); x.textContent = t; x.hidden = false; clearTimeout(T); T = setTimeout(function(){ x.hidden = true; }, 2800); };
  var q = new URLSearchParams(location.search), D = null;
  var ub = function(s){ return decodeURIComponent(escape(atob(String(s || "").replace(/-/g, "+").replace(/_/g, "/")))); };
  if (q.get("e")){ // 짧은 링크: e=일정 k=공정 d=날짜(YYMMDD.YYMMDD) c=확인코드 s=현장(b64) n=업체(b64)
    var KL = {prot:"보양",demo:"철거",plumb:"설비",elec:"전기",wp:"방수",tile:"타일",sani:"도기 세팅",dome:"돔천장",sil:"실리콘",etc:"기타"};
    var ds = (q.get("d") || "").split(".").filter(function(x){ return /^\d{6}$/.test(x); }).map(function(x){ return "20" + x.slice(0, 2) + "-" + x.slice(2, 4) + "-" + x.slice(4); });
    var W = ["일","월","화","수","목","금","토"];
    try { D = {ev: q.get("e"), kk: q.get("k"), c: q.get("c"), ds: ds, k: KL[q.get("k")] || q.get("k") || "", site: q.get("s") ? ub(q.get("s")) : "", to: q.get("n") ? ub(q.get("n")) : "",
      p: (q.get("p") || "").replace(/[^\d]/g, ""), days: ds.map(function(k){ var p = k.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]); return [(d.getMonth() + 1) + "/" + d.getDate(), W[d.getDay()], ""]; }), short: true}; } catch(_){ D = null; }
  } else { try { D = JSON.parse(ub(q.get("d"))); } catch(_){} }
  if (!D || !D.ev){ $("m").innerHTML = '<div class="done"><b>링크를 읽지 못했어요</b><p class="dim">받으신 문자의 링크를 다시 눌러 주세요.</p></div>'; return; }
  document.title = "904 " + (D.k || "") + " 회신";
  $("kind").textContent = (D.k || "") + " 외주 요청";
  $("h").textContent = (D.to ? D.to + " 사장님, " : "") + "아래 일정 가능하신가요?";
  $("card").innerHTML = '<div class="sec"><i>현장</i><div><div class="site">' + H(D.site) + '</div>' + (D.addr ? '<div class="dim">' + H(D.addr) + '</div>' : '') + '</div></div>'
    + '<div class="sec"><i>일정</i><div class="days">' + ((D.days || []).length ? D.days.map(function(x){ return '<div class="day"><b>' + H(x[0]) + ' <em>(' + H(x[1]) + ')</em></b><span>' + H(x[2]) + '</span></div>'; }).join("") : '<div class="day"><b>날짜 협의</b></div>') + '</div></div>'
    + ((D.where || []).length ? '<div class="sec"><i>위치</i><div>' + D.where.map(function(w){ return '<div><b>' + H(w[0]) + '</b>' + (w[1] ? ' <span class="dim">' + H(w[1]) + '</span>' : '') + (w[2] ? '<div class="dim" style="font-size:13px">' + H(w[2]) + '</div>' : '') + '</div>'; }).join("") + '</div></div>' : '')
    + ((D.body || []).length || D.memo ? '<div class="sec"><i>내용</i><div>' + (D.body || []).map(function(l){ return '<div>' + H(l) + '</div>'; }).join("") + (D.memo ? '<div class="memo">' + H(D.memo).replace(/\n/g, "<br>") + '</div>' : '') + '</div></div>' : '')
    + (D.short ? '<div class="sec"><i>내용</i><div class="dim">받으신 요청서 이미지를 봐 주세요</div></div>' : '')
    + ((D.who || []).length ? '<div class="sec who"><i>담당</i><div>' + D.who.map(function(w){ return '<div><b>' + H(w[0]) + '</b><a href="tel:' + H(String(w[1]).replace(/[^\d]/g, "")) + '">' + H(fmt(w[1])) + '</a></div>'; }).join("") + '</div></div>' : '');
  $("by").value = D.to || "";

  var KEY = "904reply:" + D.ev + ":" + D.kk + ":" + (D.ds || []).join(","), ans = "";
  try { var old = JSON.parse(localStorage.getItem(KEY) || "null"); if (old) toast("이미 " + old.label + "(으)로 회신하셨어요 · 바꾸려면 다시 보내 주세요"); } catch(_){}
  var addDate = function(v){ var i = $("altList").children.length, r = document.createElement("div"); r.className = "r";
    r.innerHTML = '<input type="date" id="alt' + i + '" value="' + H(v || "") + '"><button type="button" aria-label="이 날짜 빼기">×</button>';
    r.querySelector("button").onclick = function(){ if ($("altList").children.length > 1) r.remove(); else r.querySelector("input").value = ""; };
    $("altList").appendChild(r); };
  $("addDate").onclick = function(){ addDate(""); };
  $("amt").addEventListener("input", function(){ var v = Number(this.value.replace(/[^\d]/g, "")) || 0; this.value = v ? v.toLocaleString("ko-KR") : ""; });
  $("ans").addEventListener("click", function(ev){ var b = ev.target.closest("button[data-a]"); if (!b) return; ans = b.dataset.a;
    [].forEach.call($("ans").children, function(x){ x.setAttribute("aria-pressed", String(x === b)); });
    $("more").hidden = false; $("altBox").hidden = ans !== "alt"; $("amtBox").hidden = ans === "no"; if (ans === "alt" && !$("altList").children.length) addDate((D.ds || [])[0] || "");
    $("send").textContent = ans === "ok" ? "가능하다고 회신하기" : ans === "no" ? "어렵다고 회신하기" : "이 날짜로 회신하기";
    setTimeout(function(){ $("more").scrollIntoView({behavior: "smooth", block: "nearest"}); }, 50); });
  var WD = ["일","월","화","수","목","금","토"], mdw = function(k){ var p = k.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
  var sending = false;
  $("send").onclick = function(){
    if (!ans){ toast("가능 여부를 먼저 눌러 주세요"); return; }
    var alt = ans === "alt" ? [].map.call($("altList").querySelectorAll("input"), function(i){ return i.value; }).filter(Boolean).sort() : [];
    if (ans === "alt" && !alt.length){ toast("가능한 날짜를 골라 주세요"); return; }
    if (sending) return; sending = true; var b = $("send"); b.disabled = true; var t0 = b.textContent; b.textContent = "보내는 중…";
    var label = ans === "ok" ? "가능" : ans === "no" ? "불가능" : "다른 날 가능", note = $("note").value.trim(), by = $("by").value.trim(), amount = ans === "no" ? 0 : (Number(String($("amt").value).replace(/[^\d]/g, "")) || 0);
    var data = {v: 1, t: "outreply", ev: D.ev, kk: D.kk, c: D.c, ds: D.ds || [], ans: ans, alt: alt, amount: amount, note: note, by: by, vendor: D.to || "", site: D.site || "", k: D.k || "", at: new Date().toISOString()};
    var txt = ["[" + D.k + " 외주 회신] " + label, "현장: " + D.site, "업체: " + (by || D.to || ""), "요청 일정: " + ((D.ds || []).map(mdw).join(", ") || "협의"), alt.length ? "가능한 날: " + alt.map(mdw).join(", ") : "", amount ? "예상 견적: " + amount.toLocaleString("ko-KR") + "원" : "", note ? "메모: " + note : ""].filter(Boolean).join("\n");
    fetch(SEND_TO, {method: "POST", headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify({_subject: "[외주 회신] " + label + " · " + (by || D.to || "업체") + " · " + D.site + " · " + D.k, _template: "box", _captcha: "false", 회신: txt, data: "904OUT" + JSON.stringify(data) + "904END"})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok || j.success === false || j.success === "false") throw new Error(j.message || ("HTTP " + r.status)); }); })
      .then(function(){ try { localStorage.setItem(KEY, JSON.stringify({label: label, at: Date.now()})); } catch(_){}
        $("m").innerHTML = '<div class="done"><b>회신 보냈어요</b><p>' + H(label) + (alt.length ? " · " + H(alt.map(mdw).join(", ")) : "") + (amount ? " · " + amount.toLocaleString("ko-KR") + "원" : "") + '</p><p class="dim">904에서 확인하고 다시 연락드릴게요.<br>감사합니다.</p></div>'; window.scrollTo({top: 0}); })
      .catch(function(err){ sending = false; b.disabled = false; b.textContent = "다시 보내기";
        var ph = D.p || ((D.who || [])[0] || [])[1] || "", ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
        var fb = $("fb") || document.createElement("div"); fb.id = "fb"; fb.className = "fb";
        fb.innerHTML = '<b>회신이 전송되지 않았어요</b><small>' + H(String(err && err.message || "연결 문제")).slice(0, 120) + '</small>'
          + (ph ? '<a class="send fbsms" href="sms:' + H(ph.replace(/[^\d]/g, "")) + (ios ? "&" : "?") + 'body=' + encodeURIComponent(txt) + '">💬 문자로 회신 보내기</a>' : '')
          + '<small>문자로 보내도 904에서 똑같이 확인해요</small>';
        b.after(fb); fb.scrollIntoView({behavior: "smooth", block: "nearest"}); });
  };
})();
</script>
</body>
</html>
